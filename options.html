<!DOCTYPE html>
<html>
<head>
  <title>Crisp Chat Rewriter — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 32px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 24px; }
    h2 { font-size: 15px; margin: 24px 0 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 16px;
    }
    select:focus, input:focus { outline: none; border-color: #3b82f6; }
    .field { margin-bottom: 16px; }
    button {
      padding: 10px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #2563eb; }
    .saved { color: #4ade80; font-size: 13px; margin-left: 12px; display: none; }
    .error { color: #f87171; font-size: 13px; margin-left: 12px; }
    .hint { color: #94a3b8; font-size: 12px; margin: -10px 0 0; }
    .hint.error { color: #f87171; margin-left: 0; }
    .checkbox { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .checkbox input { margin: 0; }
    .shortcut-row { display: flex; gap: 8px; }
    .shortcut-row input { margin-bottom: 16px; cursor: pointer; }
    button.secondary { background: #334155; margin-top: 0; margin-bottom: 16px; padding: 8px 14px; }
    button.secondary:hover { background: #475569; }
  </style>
</head>
<body>
  <h1>Crisp Chat Rewriter</h1>

  <h2>OpenAI</h2>
  <div class="field">
    <label for="openai-key">API Key</label>
    <input type="password" id="openai-key" placeholder="sk-..." autocomplete="off" />
  </div>
  <div class="field">
    <label for="openai-model">Model</label>
    <input type="text" id="openai-model" placeholder="gpt-4.1-mini" />
  </div>

  <h2>Reply Suggestions</h2>
  <div class="field">
    <label for="reply-suggest-mode">Show suggestions when hovering a customer's avatar</label>
    <select id="reply-suggest-mode">
      <option value="hover">On hover</option>
      <option value="alt">Only while holding Alt</option>
      <option value="off">Disabled</option>
    </select>
  </div>

  <h2>Open Store Link</h2>
  <div class="field">
    <label class="checkbox">
      <input type="checkbox" id="store-link-open-visible" />
      Show the open icon next to the copy icon
    </label>
  </div>
  <div class="field">
    <label for="store-link-open-prefix">URL prefix</label>
    <input type="text" id="store-link-open-prefix" placeholder="https://example.com/search?q=" />
    <p class="hint">The store URL, without its protocol, is added straight after this text.</p>
  </div>
  <div class="field">
    <label for="store-link-open-shortcut">Keyboard shortcut</label>
    <div class="shortcut-row">
      <input type="text" id="store-link-open-shortcut" readonly placeholder="No shortcut" />
      <button type="button" class="secondary" id="store-link-open-shortcut-clear">Clear</button>
    </div>
    <p class="hint" id="store-link-open-shortcut-hint">Click the field and press the keys. Works even when the icon is hidden.</p>
  </div>

  <button id="save">Save Settings</button>
  <span class="saved" id="saved">Saved!</span>
  <span class="error" id="save-error"></span>

  <script src="shortcut.js"></script>
  <script src="options.js"></script>
</body>
</html>
