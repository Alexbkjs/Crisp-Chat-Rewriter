<!DOCTYPE html>
<html>
<head>
  <title>Crisp Chat Rewriter — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 32px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 24px; }
    h2 { font-size: 15px; margin: 24px 0 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 16px;
    }
    select:focus, input:focus { outline: none; border-color: #3b82f6; }
    .field { margin-bottom: 16px; }
    button {
      padding: 10px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #2563eb; }
    .saved { color: #4ade80; font-size: 13px; margin-left: 12px; display: none; }
  </style>
</head>
<body>
  <h1>Crisp Chat Rewriter</h1>

  <h2>OpenAI</h2>
  <div class="field">
    <label for="openai-key">API Key</label>
    <input type="password" id="openai-key" placeholder="sk-..." autocomplete="off" />
  </div>
  <div class="field">
    <label for="openai-model">Model</label>
    <input type="text" id="openai-model" placeholder="gpt-4.1-mini" />
  </div>

  <h2>Reply Suggestions</h2>
  <div class="field">
    <label for="reply-suggest-mode">Show suggestions when hovering a customer's avatar</label>
    <select id="reply-suggest-mode">
      <option value="hover">On hover</option>
      <option value="alt">Only while holding Alt</option>
      <option value="off">Disabled</option>
    </select>
  </div>

  <button id="save">Save Settings</button>
  <span class="saved" id="saved">Saved!</span>

  <script src="options.js"></script>
</body>
</html>
